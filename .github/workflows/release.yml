name: Validate Unity package payload
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Validate language
        run: dotnet run --project tests/HanCSharp.Tests
      - name: Validate completion catalog
        run: dotnet run --project editor-support/EditorSupport.Tests
      - name: Validate Unity bridge
        shell: pwsh
        run: |
          dotnet publish src/HanCSharp.Cli -c Release -o app --self-contained false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/UnityBridge.Tests -- C:\han-bridge-ci
      - name: Validate safe update and preview watcher
        run: dotnet run --project tests/Updater.Tests -- C:\han-update-ci
      - name: Build Visual Studio extension
        shell: pwsh
        run: ./editor-support/Build-Extension.ps1
      - name: Build DLL payload without EXE
        shell: pwsh
        run: ./tools/Build-UnityPayload.ps1 -OutputDirectory artifacts/UnityRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HanCSharp-UnityPayload
          path: artifacts/UnityRelease/HanCSharp-UnityPayload.zip
          if-no-files-found: error
